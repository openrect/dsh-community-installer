[package]
name = "dsh-community-installer"
version = "0.4.6"
description = "Unofficial community installer and local controller for DSH"
authors = ["DSH Community Installer contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "dsh_community_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-community-installer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
serde_json = "=1.0.151"

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
futures-util = "=0.3.34"
fs2 = "=0.4.3"
hex = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
zip = { version = "=8.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
tempfile = "=3.27.0"
